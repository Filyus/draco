# - Prefer concrete file/line evidence over broad percentages.

version: 1
last_reviewed: "2026-04-24"

items:
  - id: rust-edgebreaker-multi-attribute-wip
    area: draco-core
    priority: high
    status: open
    summary: "Edgebreaker multi-attribute path is still treated as WIP."
    evidence:
      - path: "crates/draco-core/tests/rust_vs_cpp_decode_test.rs"
        note: "Test forces sequential encoding because Edgebreaker multi-attr is WIP."
    impact: "Interop/roundtrip confidence is limited for Edgebreaker meshes with multiple attributes."
    next_steps:
      - "Replace sequential fallback in tests with a real Edgebreaker multi-attribute fixture."
      - "Verify Rust decode and C++ decode agree on attribute values and connectivity."

  - id: rust-drc-bitstream-coverage
    area: draco-core
    priority: medium
    status: open
    summary: "DRC decoder supports only selected bitstream variants."
    evidence:
      - path: "crates/draco-core/tests/drc_existing_files_test.rs"
        note: "Test filters mesh support to v2.2+ and point cloud support to v2.3 KD-tree or Rust v1.3 sequential."
      - path: "crates/draco-core/tests/drc_existing_files_test.rs"
        note: "Test skips files that hit Unsupported Edgebreaker traversal decoder type."
    impact: "Some shipped/legacy .drc assets remain intentionally outside the supported Rust decoder surface."
    next_steps:
      - "Inventory skipped .drc fixtures by header version, geometry type, method, and failure reason."
      - "Implement the highest-value missing legacy layout or traversal variant first."

  - id: wasm-ply-reader-binary
    area: web
    priority: medium
    status: open
    summary: "WASM PLY reader does not parse binary PLY."
    evidence:
      - path: "web/ply-reader-wasm/src/lib.rs"
        note: "parse_binary_ply returns a not implemented error after reading header metadata."
    impact: "Browser users must use ASCII PLY or the native draco-io reader for binary PLY."
    next_steps:
      - "Port the native draco-io binary PLY parsing path into the WASM reader or share a common parser."
      - "Add wasm-facing tests for binary_little_endian and binary_big_endian fixtures."

  - id: gltf-reader-subset
    area: draco-io
    priority: medium
    status: open
    summary: "glTF/GLB reader only supports a narrow mesh/accessor subset."
    evidence:
      - path: "crates/draco-io/src/gltf_reader.rs"
        note: "External buffer URIs in GLB return Unsupported."
      - path: "crates/draco-io/src/gltf_reader.rs"
        note: "VEC2 and VEC3 attribute accessors only accept FLOAT component type."
      - path: "crates/draco-io/src/gltf_reader.rs"
        note: "Primitive mode must be TRIANGLES."
    impact: "Valid glTF files with external resources, non-float normalized attributes, or non-triangle primitives are rejected or skipped."
    next_steps:
      - "Decide target glTF subset and document it in draco-io."
      - "Add support for the next common accessor case before widening primitive modes."

  - id: fbx-compressed-arrays-default-feature
    area: draco-io
    priority: low
    status: open
    summary: "FBX compressed arrays are unsupported unless the compression feature is enabled."
    evidence:
      - path: "crates/draco-io/src/fbx_reader.rs"
        note: "Compressed array decoding returns Unsupported without the compression feature."
      - path: "crates/draco-io/src/fbx_writer.rs"
        note: "Compressed array writing is feature-gated."
    impact: "Default draco-io builds may reject common FBX files that use compressed arrays."
    next_steps:
      - "Decide whether compression should be part of default features."
      - "If not, surface this limitation in public docs and examples."

  - id: sequential-prediction-method-coverage
    area: draco-core
    priority: medium
    status: open
    summary: "Sequential integer attribute decoder does not cover every declared prediction method."
    evidence:
      - path: "crates/draco-core/src/prediction_scheme.rs"
        note: "Enum declares MultiParallelogram and deprecated texcoord prediction methods."
      - path: "crates/draco-core/src/sequential_integer_attribute_decoder.rs"
        note: "Unsupported prediction method branches return false."
    impact: "Some valid C++-encoded streams can fail when they use unimplemented prediction methods."
    next_steps:
      - "Map real fixtures to the unimplemented prediction methods."
      - "Either implement each method or explicitly reject it earlier with a typed error and fixture coverage."
