# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-04-24"

items:
  - id: rust-drc-encode-cpp-interop-confidence
    area: draco-core
    priority: medium
    status: open
    summary: "Rust encode production confidence is lower than decode and needs broader C++ interop regression coverage."
    evidence:
      - path: "crates/draco-core/tests/rust_vs_cpp_decode_test.rs"
        note: "There is mandatory Rust-encoded Edgebreaker interop coverage for a multi-attribute mesh, but it is not a broad encode matrix."
      - path: "crates/draco-core/tests/drc_existing_files_test.rs"
        note: "Existing legacy work mostly strengthens Rust decode of C++-generated streams; it does not prove Rust encoder output across versions, methods, and attribute layouts."
    impact: "Decode of known-good files is much closer to production-ready than Rust encode compatibility, especially for downstream C++ consumers and varied attribute/prediction combinations."
    next_steps:
      - "Build a small encode interop matrix for mesh sequential, mesh Edgebreaker, and point-cloud sequential using POSITION, NORMAL, TEX_COORD, and COLOR where supported."
      - "For each Rust-encoded output, require C++ draco_decoder to decode successfully and compare minimal geometry/attribute invariants."
      - "Keep the matrix small and deterministic so it can run in CI when C++ tools are available."

  - id: rust-drc-production-coverage-matrix
    area: draco-core
    priority: medium
    status: open
    summary: "Production-readiness confidence needs coverage beyond the current small compatibility fixtures."
    evidence:
      - path: "testdata/legacy_draco/README.md"
        note: "Legacy smoke fixtures intentionally cover a minimal Draco 1.0.0/1.1.0 mesh and point-cloud set, not a full version/attribute/prediction matrix."
      - path: "implementation_state.yaml"
        note: "Implementation state records Draco 1.0.0+ as the policy floor and leaves older v1.1/v1.2 fixture skips out of scope."
    impact: "The current suite gives strong signal for selected known-good streams, but not for the long tail of quantization modes, metadata, prediction schemes, attribute combinations, and real-world assets."
    next_steps:
      - "Define a compact production coverage matrix for supported Draco 1.0.0+ decode paths, explicitly listing required geometry types, methods, attributes, transforms, and metadata cases."
      - "Add only missing high-value fixtures or generated tests from that matrix; avoid committing a large exhaustive fixture zoo."
      - "Keep out-of-scope pre-Draco-1.0.0 streams documented as policy rather than actionable decoder gaps."
