[package]
name = "draco-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["encoder", "decoder"]
encoder = []
decoder = []
debug_logs = []
force_sequential_seeds = []

[dependencies]
thiserror = "2.0.17"
bytemuck = { version = "1.24.0", features = ["derive"] }

[dev-dependencies]
draco-io = { path = "../draco-io" }
tempfile = "3.24.0"
