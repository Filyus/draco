[package]
name = "draco-core"
version = "0.1.0"
edition = "2021"

[features]
default = [
    "encoder",
    "decoder",
    "point_cloud_decode",
    "edgebreaker_valence",
    "backwards_compat_decode",
]
encoder = []
decoder = []
point_cloud_decode = ["decoder"]
edgebreaker_valence = []
backwards_compat_decode = [
    "deprecated_multi_parallelogram_decode",
    "deprecated_tex_coords_prediction",
    "legacy_bitstream_decode",
]
legacy_bitstream_decode = ["decoder"]
deprecated_multi_parallelogram_decode = ["decoder"]
deprecated_tex_coords_prediction = ["decoder"]
debug_logs = []
force_sequential_seeds = []

[dependencies]
thiserror = "2.0.17"
bytemuck = { version = "1.24.0", features = ["derive"] }

[dev-dependencies]
draco-io = { path = "../draco-io" }
tempfile = "3.24.0"

